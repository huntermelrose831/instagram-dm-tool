version: "3.8"

services:
  instagram-dm-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: instagram-dm-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./backend/database:/app/database
      - ./backend/exports:/app/exports
      - ./backend/logs:/app/logs
    networks:
      - turbodm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  instagram-dm-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: instagram-dm-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - instagram-dm-backend
    networks:
      - turbodm-network
    environment:
      - NGINX_HOST=turbodm.pro
      - NGINX_PORT=80

networks:
  turbodm-network:
    driver: bridge

volumes:
  database_data:
  exports_data:
  logs_data:
